name: gitleaks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"  # daily history sweep (R29 follow-up, queued at DNS flip)

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so scheduled sweeps catch everything
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
